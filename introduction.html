<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Amazing!</title>
  <style>
    body {
      background-color: #f9e6f1;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }
    a{
        text-decoration: none;
    }
    img{
        margin-top:8%;
        height:15;
        width: 17%;
    }
    .image-row {
      display: flex;
      justify-content: center; /* you can use 'flex-start' to align left */
    }
    h1 {
      font-size: 48px;
      color: #ff1493;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 2s forwards;
    }
    p {
      font-size: 20px;
      color: #4b0082;
      opacity: 0;
      animation: fadeIn 4s forwards;
      animation-delay: 2s;
      max-width: 80%;
    }
    .heart {
      font-size: 50px;
      animation: heartbeat 1s infinite;
      margin: 20px;
    }
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: -1;
    }
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background-color: #ff69b4;
      border-radius: 50%;
      animation: sparkle 2s infinite;
    
      
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes sparkle {
      0% {
        opacity: 0.3;
        transform: scale(0.5);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0.3;
        transform: scale(0.5);
      }
    }
  </style>
</head>
<body>
    <div class="image-row">
    <img src="l.jpg" alt="Italian Trulli">
    <img src="e.jpg" alt="Italian Trulli">
 
</div>
  <h1>Hey bopbop</h1>
  <p id="message"></p>
 <a href="index.html">
  <div class="heart">💖</div>
  
  <div class="stars"></div>
</a>
  <script>
    // Typing animation effect
    const messageElement = document.getElementById("message");
    const message = "I just wanted to tell you how proud I am of you. Nakikita ko kung gaano ka katiyaga and kung paano mo binibigay ang best mo sa lahat ng bagay. Hindi madali, pero you always manage to push through, and that’s something I really admire about you. You truly deserve all the success na dumarating sa’yo, and I know that you’re capable of achieving even more. Keep going, and always remember that I’m here, rooting for you.";
    let index = 0;
    
    function typeMessage() {
      if (index < message.length) {
        messageElement.innerHTML += message.charAt(index);
        index++;
        setTimeout(typeMessage, 50);
      }
    }

    window.onload = function() {
      // Start typing animation on page load
      typeMessage();

      // Generate stars on the background
      createStars();

      // Heartbeat animation
      document.querySelector(".heart").style.animation = "heartbeat 1.5s infinite ease-in-out";
    };

    function createStars() {
      const starsContainer = document.querySelector(".stars");
      for (let i = 0; i < 100; i++) {
        const star = document.createElement("div");
        star.classList.add("star");
        star.style.top = Math.random() * window.innerHeight + "px";
        star.style.left = Math.random() * window.innerWidth + "px";
        star.style.animationDelay = Math.random() * 2 + "s"; 
        star.style.animationDuration = Math.random() * 2 + 1 + "s";
        starsContainer.appendChild(star);
      }
    }
  </script>

</body>
</html>
